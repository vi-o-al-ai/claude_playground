<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Games Arcade</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7b2ff7" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #0f0f23;
        color: #e0e0e0;
        min-height: 100vh;
      }

      header {
        text-align: center;
        padding: 3rem 1rem 2rem;
        background: linear-gradient(135deg, #1a1a3e 0%, #0f0f23 100%);
        border-bottom: 2px solid #333;
      }

      header h1 {
        font-size: 2.5rem;
        letter-spacing: 0.1em;
        background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d95);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      header p {
        margin-top: 0.75rem;
        color: #888;
        font-size: 1.1rem;
      }

      .section {
        max-width: 1100px;
        margin: 2.5rem auto;
        padding: 0 1.5rem;
      }

      .section-title {
        font-size: 1.5rem;
        color: #fff;
        letter-spacing: 0.05em;
        border-bottom: 1px solid #2a2a4a;
        padding-bottom: 0.5rem;
      }

      .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
        margin-top: 1.5rem;
      }

      .game-card {
        background: #1a1a2e;
        border: 1px solid #2a2a4a;
        border-radius: 12px;
        padding: 2rem 1.5rem;
        text-decoration: none;
        color: inherit;
        transition:
          transform 0.2s,
          border-color 0.2s,
          box-shadow 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .game-card:hover {
        transform: translateY(-4px);
        border-color: #7b2ff7;
        box-shadow: 0 8px 24px rgba(123, 47, 247, 0.2);
      }

      .game-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      .game-card h2 {
        font-size: 1.3rem;
        margin-bottom: 0.5rem;
        color: #fff;
      }

      .game-card p {
        font-size: 0.9rem;
        color: #888;
        line-height: 1.4;
      }

      footer {
        text-align: center;
        padding: 2rem 1rem;
        color: #555;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>AI Games Arcade</h1>
      <p>A collection of browser games built with AI</p>
    </header>

    <!--
      Cards are generated at build time from each project's arcade metadata by
      scripts/build-manifest.mjs — never hand-edit them here.
    -->
    <main>
      <section class="section" id="games-section" hidden>
        <h2 class="section-title">Games</h2>
        <div class="games-grid" id="games-grid"></div>
      </section>

      <section class="section" id="apps-section" hidden>
        <h2 class="section-title">Apps</h2>
        <div class="games-grid" id="apps-grid"></div>
      </section>
    </main>

    <footer>
      Built with AI &bull;
      <a href="https://github.com/vi-o-al-ai/claude_playground" style="color: #7b2ff7">
        Source on GitHub
      </a>
    </footer>

    <script type="module" src="./src/main.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {
          // Service worker registration failed — app works fine without it
        });
      }
    </script>
  </body>
</html>
